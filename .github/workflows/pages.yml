name: 스튜디오 배포

# 에이전트가 단계를 넘길 때마다 meta.json·state.json 이 바뀌고, push 하면 화면이 갱신된다.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "episodes/*/meta.json"
      - "crew.json"
      - "bible/episodes-plan.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 커밋된 기록으로 state.json 을 다시 만든다 (기록에 없는 값은 만들지 않는다)
      - run: node pipeline/build-state.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
